[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "orgizepy"
version = "0.1.0"
description = "Orgize Python SDK for parsing, functions, source edits, and contracts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.orgizepy", "LICENSES/*", "THIRD_PARTY_NOTICES.md"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[dependency-groups]
wheel-repair = [
    "delocate==0.13.0; sys_platform == 'darwin'",
    "auditwheel @ git+https://github.com/pypa/auditwheel@b9a93b046492f986f7355bc23672359657e5e769; sys_platform == 'linux'",
]

[tool.maturin]
python-source = "src"
module-name = "orgizepy._orgize"
bindings = "pyo3"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
