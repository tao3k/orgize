[package]
name = "orgizepy"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "_orgize"
crate-type = ["cdylib"]

[dependencies]
orgize = { path = "../..", default-features = false }
pyo3 = { version = "0.27.2", features = ["extension-module", "abi3-py311", "generate-import-lib"] }

[features]
default = ["runtime-rust"]
runtime-rust = ["orgize/runtime-rust"]
runtime-scheme = ["orgize/runtime-scheme"]
