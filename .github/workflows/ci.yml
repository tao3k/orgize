name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - v0.10

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure Windows cargo git paths
        if: ${{ matrix.os == 'windows-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.longpaths true
          echo "CARGO_HOME=D:/c" >> "$GITHUB_ENV"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Configure sccache backend
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Restore sccache cache (fallback)
        if: ${{ env.SCCACHE_GHA_ENABLED != 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: orgize-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.toml', '.github/workflows/ci.yml') }}-${{ github.run_id }}
          restore-keys: |
            orgize-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.toml', '.github/workflows/ci.yml') }}-
            orgize-sccache-${{ runner.os }}-${{ hashFiles('Cargo.toml', '.github/workflows/ci.yml') }}-
            orgize-sccache-${{ runner.os }}-

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          shared-key: orgize-ci-${{ runner.os }}
          cache-on-failure: true

      - name: Fetch cargo dependencies
        run: cargo fetch

      - name: Check formatting
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features

      - name: Run focused Org query performance gate
        run: cargo test --release --lib document_query_org_elements_ast_stays_inside_scenario_gate -- --ignored --test-threads=1

      - name: Run clippy
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Save sccache cache (fallback)
        if: ${{ always() && !cancelled() && env.SCCACHE_GHA_ENABLED != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: orgize-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.toml', '.github/workflows/ci.yml') }}-${{ github.run_id }}

      - name: sccache summary
        if: ${{ always() }}
        shell: bash
        run: sccache --show-stats || true

  python-sdk:
    name: orgizepy / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libsqlite3-dev zlib1g-dev pkg-config patchelf
      - name: System libraries
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install gcc openssl pkg-config sqlite zlib
      - name: Install released Gerbil
        run: bash tools/ci/install-gerbil-release.sh
      - name: Build Scheme Contract package
        run: |
          gxpkg deps --install
          gerbil build
      - name: Verify Scheme Org parser and Contract
        run: |
          gxpkg install github.com/tao3k/gerbil-parser@b4809247a32fec1aa0f67415a917db1e5b822f15
          just scheme-test "$GERBIL_PATH/lib" "$GERBIL_PATH/lib"
          generated="$(mktemp)"
          gerbil env gxi languages/org/v1/generate-rowan-event-ir.ss "$generated"
          cmp "$generated" languages/org/v1/generated/rowan-events.ir.json
      - name: Verify independent C and Rust consumers
        run: just contract-smoke
      - name: Verify Python SDK
        run: just python-test
      - name: Build and repair Python wheel
        run: just python-wheel-repair
      - name: Test installed wheel outside source tree
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/orgizepy-wheel"
          uv pip install --python "$RUNNER_TEMP/orgizepy-wheel/bin/python" bindings/python/dist/repaired/orgizepy-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/orgizepy-wheel/bin/python" \
            "$GITHUB_WORKSPACE/bindings/python/tests/installed_smoke.py"
      - name: Qualify complete SDK from source distribution
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uv build --directory bindings/python --sdist
          if output=$(uv build bindings/python/dist/orgizepy-*.tar.gz --wheel \
            --out-dir "$RUNNER_TEMP/orgizepy-sdist-wheel" 2>&1); then
            echo 'Source distribution unexpectedly produced a wheel without Contract'
            exit 1
          fi
          case "$output" in
            *'the complete orgizepy SDK requires'*) ;;
            *) echo "$output"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/orgizepy-sdist-source" "$RUNNER_TEMP/orgizepy-sdist-gerbil"
          tar -xzf bindings/python/dist/orgizepy-*.tar.gz \
            -C "$RUNNER_TEMP/orgizepy-sdist-source"
          cd "$RUNNER_TEMP/orgizepy-sdist-source/orgizepy-0.1.0"
          export GERBIL_PATH="$RUNNER_TEMP/orgizepy-sdist-gerbil"
          gxpkg deps --install
          gxi -:max-heap=512M build.ss compile
          python3 bindings/c/build-native-library.py \
            --output src/orgizepy/lib/liborgize.so
          uv build --wheel
          "$GITHUB_WORKSPACE/bindings/python/.venv/bin/auditwheel" repair \
            --wheel-dir "$RUNNER_TEMP/orgizepy-sdist-repaired" dist/orgizepy-*.whl
          uv venv "$RUNNER_TEMP/orgizepy-sdist-install"
          uv pip install --python "$RUNNER_TEMP/orgizepy-sdist-install/bin/python" \
            "$RUNNER_TEMP"/orgizepy-sdist-repaired/orgizepy-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/orgizepy-sdist-install/bin/python" \
            "$GITHUB_WORKSPACE/bindings/python/tests/installed_smoke.py"

  gh-pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read
      pages: write
      id-token: write

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: https://tao3k.github.io/orgize/

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build
        run: wasm-pack build -t web -d ./dist --out-name orgize ./wasm/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./wasm"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
