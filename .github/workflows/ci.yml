name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - v0.10

concurrency:
  group: orgize-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  qualify:
    name: qualify / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    uses: ./.github/workflows/qualify.yml
    with:
      runner: ${{ matrix.os }}
