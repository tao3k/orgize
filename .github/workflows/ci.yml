name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - v0.10

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / ${{ matrix.os }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
        runtime: [runtime-rust, runtime-scheme]

    env:
      RUNTIME_FEATURES: orgize/${{ matrix.runtime }},orgizepy/${{ matrix.runtime }},orgize/indexmap,orgize/chrono,orgize/tracing,orgize/datafusion-sql,orgize/syntax-org-fc,orgize/md

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Configure sccache backend
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Restore sccache cache (fallback)
        if: ${{ env.SCCACHE_GHA_ENABLED != 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: orgize-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.toml', '.github/workflows/ci.yml') }}-${{ github.run_id }}
          restore-keys: |
            orgize-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.toml', '.github/workflows/ci.yml') }}-
            orgize-sccache-${{ runner.os }}-${{ hashFiles('Cargo.toml', '.github/workflows/ci.yml') }}-
            orgize-sccache-${{ runner.os }}-

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          shared-key: orgize-ci-${{ runner.os }}
          cache-on-failure: true

      - name: Fetch cargo dependencies
        run: cargo fetch

      - name: Check formatting
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: cargo fmt --all -- --check

      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Native system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libsqlite3-dev zlib1g-dev pkg-config ripgrep jq
      - name: Native system libraries
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install gcc openssl pkg-config sqlite zlib ripgrep jq
      - name: Install released Gerbil
        run: bash tools/ci/install-gerbil-release.sh
      - name: Prepare pinned native Scheme program
        run: just ci-prepare
      - name: Verify native Scheme owners
        run: just ci-scheme-test

      - name: Select producer FFI bundle output
        if: matrix.runtime == 'runtime-scheme'
        run: echo "ORGIZE_FFI_EXPORT=$GITHUB_WORKSPACE/target/ffi-bundle" >> "$GITHUB_ENV"

      - name: Run tests
        run: just ci-rust-test "${{ env.RUNTIME_FEATURES }}"

      - name: Run focused workspace admission performance gate
        run: just ci-scenario-test "${{ matrix.runtime }}" integration_test workspace_contract_scale_scenario_stays_in_budget

      - name: Run focused Org query performance gate
        run: just ci-scenario-test "${{ matrix.runtime }}" lib document_query_org_elements_aot_stays_inside_scenario_gate

      - name: Run plan ledger AOT performance gate
        id: plan_ledger_aot_gate
        run: just ci-scenario-test "${{ matrix.runtime }}" integration_test plan_ledger_memory_projection_stays_in_millisecond_budget

      - name: Profile failed plan ledger AOT gate
        if: ${{ failure() && steps.plan_ledger_aot_gate.conclusion == 'failure' }}
        continue-on-error: true
        env:
          ORGIZE_PROFILE_PLAN_LEDGER: "1"
        run: just ci-scenario-test "${{ matrix.runtime }}" integration_test plan_ledger_memory_projection_stays_in_millisecond_budget

      - name: Run clippy
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: just ci-clippy "${{ env.RUNTIME_FEATURES }}"

      - name: Qualify relocated FFI consumption
        if: matrix.runtime == 'runtime-scheme'
        shell: bash
        run: |
          set -euo pipefail
          mv target/ffi-bundle target/ffi-consumer
          unset ORGIZE_FFI_EXPORT
          export ORGIZE_FFI_BUNDLE="$GITHUB_WORKSPACE/target/ffi-consumer"
          export ORGIZE_GERBIL_PROGRAM_MANIFEST="$GITHUB_WORKSPACE/target/absent-program.json"
          just ci-rust-test "${{ env.RUNTIME_FEATURES }}"

      - name: Publish qualified revision-bound FFI bundle
        if: matrix.runtime == 'runtime-scheme'
        uses: actions/upload-artifact@v4
        with:
          name: orgize-ffi-${{ github.event.pull_request.head.sha || github.sha }}-${{ runner.os }}-${{ runner.arch }}
          path: target/ffi-consumer/
          if-no-files-found: error
          retention-days: 30

      - name: Save sccache cache (fallback)
        if: ${{ always() && !cancelled() && env.SCCACHE_GHA_ENABLED != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.sccache/
          key: orgize-sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.toml', '.github/workflows/ci.yml') }}-${{ github.run_id }}

      - name: sccache summary
        if: ${{ always() }}
        shell: bash
        run: sccache --show-stats || true

  python-sdk:
    name: orgizepy / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libsqlite3-dev zlib1g-dev pkg-config patchelf ripgrep jq
      - name: System libraries
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install gcc openssl pkg-config sqlite zlib ripgrep jq
      - name: Install released Gerbil
        run: bash tools/ci/install-gerbil-release.sh
      - name: Fetch pinned native dependencies
        run: cargo fetch --locked
      - name: Prepare pinned native Scheme program
        run: just ci-prepare
      - name: Verify native Scheme owners
        run: just ci-scheme-test
      - name: Verify Python SDK through maturin
        run: just python-test
      - name: Build and repair maturin wheel
        run: just python-wheel-repair
      - name: Test installed wheel outside source tree
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/orgizepy-wheel"
          uv pip install --python "$RUNNER_TEMP/orgizepy-wheel/bin/python" bindings/python/dist/repaired/orgizepy-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/orgizepy-wheel/bin/python" \
            "$GITHUB_WORKSPACE/bindings/python/tests/installed_smoke.py"

  gh-pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read
      pages: write
      id-token: write

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: https://tao3k.github.io/orgize/

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build
        run: wasm-pack build -t web -d ./dist --out-name orgize ./wasm/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./wasm"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
