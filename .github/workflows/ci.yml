name: Orgize macOS dependency and Scheme qualification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  GERBIL_PATH: ${{ github.workspace }}/.gerbil-ci
  ORGIZE_GERBIL_NATIVE_OUTPUT: ${{ github.workspace }}/target/program-objects
  ORGIZE_SOURCE_REV: 816b637db5e9c9a4db7cf84659c4c916253a4abe
  ORGIZE_PARSER_REV: caa5e1a78ce663f3cc3d6c83c202eee311bf907c
  ORGIZE_YUANXU_REV: bb0d501aee26970fa486e3d8369489dde57c1773

jobs:
  macos-scheme:
    name: macOS dependency revisions and Scheme tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ env.ORGIZE_SOURCE_REV }}
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: ./.github/actions/setup-native
      - name: Fetch locked Cargo sources
        run: cargo fetch --locked
      - name: Install declared dependencies
        run: just ci-dependencies
      - name: Verify installed dependency revisions
        shell: bash
        run: |
          set -euo pipefail
          just ci-verify-dependencies
          packages="$GERBIL_PATH/pkg/github.com/tao3k"
          source_rev="$(git rev-parse HEAD)"
          parser_rev="$(git -C "$packages/gerbil-parser" rev-parse HEAD)"
          yuanxu_rev="$(git -C "$packages/gebril-yuanxu" rev-parse HEAD)"
          test "$source_rev" = "$ORGIZE_SOURCE_REV"
          test "$parser_rev" = "$ORGIZE_PARSER_REV"
          test "$yuanxu_rev" = "$ORGIZE_YUANXU_REV"
          printf 'Orgize %s\nParser %s\nYuanxu %s\n' "$source_rev" "$parser_rev" "$yuanxu_rev"
      - name: Build pinned Scheme program
        run: just ci-build-program
      - name: Verify native Scheme owners through gerbil test
        run: just ci-scheme-test
      - name: Preserve Scheme qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orgize-macos-scheme-816b637
          path: target/scheme-test/
          if-no-files-found: ignore
