name: Restore the Orgize AOT program
description: Restore and verify the program built for the current source and runner
inputs:
  runner:
    description: Runner label used when preparing the program
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: orgize-program-${{ github.event.pull_request.head.sha || github.sha }}-${{ inputs.runner }}
        path: ${{ runner.temp }}/orgize-program
    - name: Admit restored program against current sources
      shell: bash
      run: |
        tar -xzf "$RUNNER_TEMP/orgize-program/orgize-program.tar.gz"
        just ci-verify-prepared
